## Primary-Agent Handoff Policy

Set `recommended_next_action.handoff_mode` to exactly: `stop-and-wait`.

**Instructions**

Present the rankings summary table and the artifact path to the user. State that the options have been ranked from best to worst. Do not recommend, advocate for, or highlight any specific option as preferred. Wait for explicit direction before proceeding.

## Notes

- The most common failure in option evaluation is assessing based on how an option is presented — its length, complexity, eloquence, transparency of risk disclosure, or reading position — rather than on its alignment with problem-derived criteria.
- The second most common failure is evaluating options in isolation rather than comparatively. Step 6 exists specifically to force direct comparison — do not skip or abbreviate it.
